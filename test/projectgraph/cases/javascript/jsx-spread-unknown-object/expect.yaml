    status: uncertain
    call_sites:
      - caller: src/App.jsx//make//onClick
        site: src/App.jsx:6
        reached: false
    uncertainties:
      - kind: unresolved-call
        site: src/App.jsx:16
      - kind: unresolved-call
        site: src/App.jsx:12
