source: safedep:hand
description: >-
  The route files export values that are no object literal. handle is the result of sequence, and the
  index records the arguments first and second of the call in the export statement as references, so
  h1 and h2 are found. other names the variable named, which holds table, so the export reaches table and
  the rule marks save. PUT takes the default fallback, because handlers has no PUT. GET and actions are
  results of calls, and the functions that the framework calls on them are no definition that an edge
  names. So each of the two exports gets a computed-name record in place of a root, and a1 and a4 read
  uncertain and not not-found.
roots:
  - key: server.js
    kind: manifest
    rule: node.package-json
  - key: src/hooks.server.ts
    kind: framework
    rule: node.sveltekit.route
  - key: src/hooks.server.ts//handle
    kind: framework
    rule: node.sveltekit.route
  - key: src/routes/a/+server.ts
    kind: framework
    rule: node.sveltekit.route
  - key: src/routes/a/+server.ts//fallback
    kind: framework
    rule: node.sveltekit.route
  - key: src/routes/b/+page.server.ts
    kind: framework
    rule: node.sveltekit.route
  - key: src/routes/b/+page.server.ts//actions
    kind: framework
    rule: node.sveltekit.route
  - key: src/routes/b/+page.server.ts//named
    kind: framework
    rule: node.sveltekit.route
  - key: src/routes/b/+page.server.ts//table
    kind: framework
    rule: node.sveltekit.route
  - key: src/routes/b/+page.server.ts//table//save
    kind: framework
    rule: node.sveltekit.route
exact_edges: true
edges:
