    to: plug//a4
    kind: direct
    confidence: high
    site: src/routes/b/+page.server.ts:4
  - from: src/routes/b/+page.server.ts//table//save
    to: plug//a5
    kind: direct
    confidence: high
    site: src/routes/b/+page.server.ts:9
unresolved:
