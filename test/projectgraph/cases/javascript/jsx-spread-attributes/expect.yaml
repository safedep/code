source: safedep:hand
description: >-
  App spreads the object handlers into a button, as <button {...handlers}>. React binds each property of the
  object as a prop of the element, so a click runs handlers.onClick, which calls danger of plug. The spread
  attribute names the object, so App must get a reference to each function that the object holds, and
  plug.danger is found. An index that reads no value of a spread attribute gives no edge and no record, and
  plug.danger reads not-found.
