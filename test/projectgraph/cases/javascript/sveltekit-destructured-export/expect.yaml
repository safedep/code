source: safedep:hand
description: >-
  The route file exports GET, PUT and POST by a destructuring declaration from the object handlers, and
  fallback from the array fallbacks. The index gives each name an export record whose target is the member
  that it takes, as handlers//rest//PUT for PUT in { rest: { PUT } }, and POST for the rename post: POST.
  A name of an array pattern takes the array. So the rule node.sveltekit.route marks each function, and
  a1, a2 and a3 are found. The function of fallbacks runs its call in the module top level, so a4 is found.
