    status: not-found
  - target: fs//rmSync
    status: uncertain
    call_sites:
      - caller: npm:store-kit@1.0.0//index.js//Store//close
        site: npm:store-kit@1.0.0//index.js:18
        reached: false
    uncertainties:
      - kind: unresolved-call
        site: npm:store-kit@1.0.0
