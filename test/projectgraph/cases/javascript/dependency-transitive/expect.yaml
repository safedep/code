source: safedep:hand
description: >-
  The bin entry calls template of lodash, a dependency under node_modules. The exports field of lodash
  gives lodash.js, which re-exports template from template.js. template calls the default export of
  lodash._reinterpolate, a dependency of lodash, and that function calls child_process.execSync. The path
  to execSync goes through both packages, and each package edge leaves the external key of the call on the
  path. The import of the default export runs the module top level of the package and does not call the
  function. No root reaches escape, so its unresolved site makes no target uncertain.
units:
  node_modules/lodash: npm:lodash@4.17.21
  node_modules/lodash._reinterpolate: npm:lodash._reinterpolate@3.0.0
