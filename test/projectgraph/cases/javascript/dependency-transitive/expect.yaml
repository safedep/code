    kind: import
    confidence: high
    site: src/main.js:1
  - from: src/main.js
    to: lodash//template
    kind: direct
    confidence: high
    site: src/main.js:3
  - from: lodash//template
    to: npm:lodash@4.17.21//lodash.js//template
    kind: package
    confidence: high
    site: npm:lodash@4.17.21//lodash.js:1
