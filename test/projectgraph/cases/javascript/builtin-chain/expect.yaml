source: safedep:hand
description: >-
  go calls run on the result of Object.assign. Object is a builtin, and Object.assign gives back its
  first argument, a Plug of the dependency plug. Plug.run calls fs.rmSync. The link step does not know
  the type of the result, so the site is a record with the method name run. The record makes fs.rmSync
  uncertain. No definition named run reaches fs.rmdirSync, so it stays not found.
units:
  node_modules/plug: npm:plug@1.0.0
roots:
  - key: main.js
    kind: manifest
    rule: node.package-json
edges:
  - from: main.js
    to: main.js//go
    kind: direct
    confidence: high
    site: main.js:8
  - from: npm:plug@1.0.0//index.js//Plug//run
    to: fs//rmSync
    kind: direct
    confidence: high
    site: npm:plug@1.0.0//index.js:5
no_edges:
  - from: main.js//go
    to: npm:plug@1.0.0//index.js//Plug//run
unresolved:
  - caller: main.js//go
    site: main.js:5
    reason: no-dependency-source
    method: run
results:
  - target: fs//rmSync
    status: uncertain
    call_sites:
      - caller: npm:plug@1.0.0//index.js//Plug//run
        site: npm:plug@1.0.0//index.js:5
        reached: false
    uncertainties:
      - kind: unresolved-call
        site: main.js:5
  - target: fs//rmdirSync
    status: not-found
    call_sites:
      - caller: npm:plug@1.0.0//index.js//Plug//zap
        site: npm:plug@1.0.0//index.js:8
        reached: false
