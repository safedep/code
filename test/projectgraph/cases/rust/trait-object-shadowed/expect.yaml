description: >-
  print takes a Box<dyn Write>, then a let binds the name w again to the dep::Plain that dep::plain returns, and
  calls write on it. The code of the crate dep is the unit cargo:dep@1.2.0. The declared type of the parameter does
  not hold after the let, so the call keeps the result type of dep::plain and goes to dep//Plain//write. If the
  declared type typed the call, it would get the default write of the trait and the cha edge to Html::write, and
  dep//Plain//write would read as not-found. Nothing calls write on an Html, so dep//Html//write is not-found.
