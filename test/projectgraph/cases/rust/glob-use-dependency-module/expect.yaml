source: safedep:hand
description: >-
  main.rs has use dep::*, which brings the module html of the crate dep into scope, and main calls html::render.
  The code of the crate dep is the unit cargo:dep@1.2.0. Rust reads a name of a glob use before a crate, so html
  names dep::html and no crate html. A link step that reads html as a crate gives the call the key html//render
  with no record, and dep//html//render reads not-found. Nothing calls escape, so dep//html//escape is not-found.
units:
  vendor/dep: cargo:dep@1.2.0
