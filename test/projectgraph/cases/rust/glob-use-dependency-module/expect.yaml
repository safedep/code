    kind: main
    rule: rust.main
  - key: src/main.rs//main
    kind: main
    rule: rust.main
exact_edges: true
edges:
  - from: src/main.rs//main
    to: dep//html//render
    kind: direct
    confidence: high
    site: src/main.rs:4
  - from: dep//html//render
    to: cargo:dep@1.2.0//src/html.rs//render
    kind: package
    confidence: high
    site: cargo:dep@1.2.0//src/html.rs:1
unresolved: []
results:
