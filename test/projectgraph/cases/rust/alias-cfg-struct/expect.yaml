description: >-
  The file declares Client two times. With the feature native, Client is a struct, and its method send calls
  std::fs::remove_file. Without the feature, Client is an alias of fallback::Client, whose new calls
  std::env::set_var. main calls Client::new, and work calls send on a parameter of the type Client. The index
  does not know which cfg the build sets, so the alias binds no type. Each call gets the record
  unknown-receiver and a name edge to the method of each declaration. So both targets are found. An index
  that lets the alias replace the struct gives only fallback::Client.send, and std::fs::remove_file reads
  not-found. An index that lets the struct win gives only the struct's new, and std::env::set_var reads
  not-found.
