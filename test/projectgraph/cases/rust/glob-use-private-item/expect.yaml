source: safedep:hand
description: >-
  main.rs has use dep::html::* and use other::*, and calls render() and util::run(). dep::html defines render
  and the module util, both private, so the glob use of dep::html brings neither. other gives the pub function
  render and the pub module util. So both calls run code of other: render calls std::fs::remove_file and
  util::run calls std::fs::remove_dir. A link step that takes a private item of a unit for a name of a glob use
  sends render() to dep//html//render and util::run() to dep//html//util//run, so std::fs::remove_dir reads
  not-found. render() keeps its record, because a closure or a parameter can bind a single name.
units:
  vendor/dep: cargo:dep@1.0.0
  vendor/other: cargo:other@1.0.0
