source: safedep:adversarial
description: Rust runs code with no call of its name. A fn pointer and a function that map takes are references. Display::fmt runs for {} in println!, whose tokens hold the struct literal Pretty {}. Drop runs at the end of a scope, Add for +, Iterator::next for a for loop and From for ?. A call on a Deref type can run a method of its target, and an impl of a trait for String adds shout to String. A macro_rules macro of another module runs its tokens.
