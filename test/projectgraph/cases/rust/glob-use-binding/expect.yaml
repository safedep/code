    to: src/jobs/worker.rs//go
    kind: direct
    confidence: high
    site: src/main.rs:5
  - from: src/jobs/worker.rs//go
    to: src/store/disk.rs//wipe
    kind: direct
    confidence: high
    site: src/jobs/worker.rs:4
  - from: src/store/disk.rs//wipe
    to: std//fs//remove_dir_all
    kind: direct
    confidence: high
    site: src/store/disk.rs:2
