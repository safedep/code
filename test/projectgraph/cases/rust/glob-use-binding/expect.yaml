source: safedep:hand
description: >-
  src/jobs/mod.rs has use crate::store::disk, so disk names the module src/store/disk.rs in the module jobs.
  src/jobs/worker.rs has use super::*, which brings each name of jobs into worker, the binding disk too. So
  disk::wipe in go calls the function wipe of src/store/disk.rs, which calls std::fs::remove_dir_all. No module
  disk is a child of worker or of the root. A link step that stops the glob path on the module that a use
  binds gives the call the key disk//wipe with no record, and std::fs::remove_dir_all reads not-found.
roots:
  - key: src/main.rs
    kind: main
    rule: rust.main
  - key: src/main.rs//main
    kind: main
    rule: rust.main
exact_edges: true
edges:
