source: safedep:hand
description: >-
  main opens a kit::Store with Store::open().unwrap() and calls save on it, and flush::all calls flush on a value of
  a generic type S: Sink. The code of the crate kit is the unit cargo:kit@1.0.0. open returns Result<Store, String>,
  so unwrap gives a Store, and the call of save gets the external key kit//Store//save, which a package edge joins
  to the method in the unit. The bound Sink is a trait of the unit, and Store implements it, so flush gets a cha
  edge to kit//Store//flush, and the site keeps its record. Store is in a private module, and lib.rs gives it on
  with pub use, so its key is kit//Store and not kit//store//Store.
