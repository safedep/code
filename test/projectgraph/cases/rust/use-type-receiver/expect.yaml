source: safedep:hand
description: >-
  src/store.rs declares the struct Item, and its inline module cache declares another Item. The inline module
  cache::deep has use crate::store::Item, so x in by_new and in by_value holds the Item of the root, and x.save()
  runs Item::save of the root, which calls std::fs::write. The call graph reads no use, so it finds the Item of
  cache for Item::new() and for Item, and sends x.save() to cache::Item::save, which calls std::fs::create_dir.
  Without the rule, std::fs::write reads not-found. The index gives the call the path of the use. In main.rs,
  qualified has use crate::b::Item and calls x.save() after let x = a::Item::new(). The path a::Item names its
  type through a, and the use of Item does not bind a, so x.save() runs a::Item::save, which calls
  std::fs::remove_file. A rule that rebinds the last name of the type sends the call to b::Item::save, so
  std::fs::remove_dir reads found and std::fs::remove_file reads not-found.
