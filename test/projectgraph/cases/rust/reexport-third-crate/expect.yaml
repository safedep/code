source: safedep:hand
description: >-
  main calls dep1::bound::save and dep1::glob::load. The unit cargo:dep1@1.0.0 has pub use dep2::store::save
  in bound and pub use dep2::store::* in glob, and the unit cargo:dep2@1.0.0 defines save and load in store.
  bound also defines audit, so the summary of dep1 has a symbol. The walk of each key of dep1 ends on the key
  of dep2, which no call names, so it has no node. A link step that links only to a node gives the keys of
  dep1 no edge and no record, and std::fs::remove_file and std::fs::remove_dir read not-found.
units:
  vendor/dep1: cargo:dep1@1.0.0
  vendor/dep2: cargo:dep2@1.0.0
roots:
  - key: src/main.rs
    kind: main
    rule: rust.main
  - key: src/main.rs//main
    kind: main
    rule: rust.main
exact_edges: true
edges:
  - from: src/main.rs//main
    to: dep1//bound//save
    kind: direct
    confidence: high
    site: src/main.rs:2
  - from: src/main.rs//main
    to: dep1//glob//load
    kind: direct
    confidence: high
    site: src/main.rs:3
  - from: dep1//bound//save
    to: dep2//store//save
    kind: package
    confidence: high
    site: cargo:dep1@1.0.0
  - from: dep1//glob//load
    to: dep2//store//load
    kind: package
    confidence: high
    site: cargo:dep1@1.0.0
  - from: dep2//store//save
    to: cargo:dep2@1.0.0//src/store.rs//save
    kind: package
    confidence: high
    site: cargo:dep2@1.0.0//src/store.rs:1
  - from: dep2//store//load
    to: cargo:dep2@1.0.0//src/store.rs//load
    kind: package
    confidence: high
    site: cargo:dep2@1.0.0//src/store.rs:5
  - from: cargo:dep2@1.0.0//src/store.rs//save
    to: std//fs//remove_file
    kind: direct
    confidence: high
    site: cargo:dep2@1.0.0//src/store.rs:2
