source: safedep:hand
description: >-
  src/sys.rs has eight glob uses, as src/sys.rs of time 0.1.45 has. The glob use of the module inner
  brings now of the inline module unix into scope through a second glob use, so main calls
  sys::now, and std::fs::remove_file is found. The six glob uses of crates in unix and the two in mac
  name no crate that the project gives. The lookup of each name that the file does not define reads
  the glob uses of the file, and the resolution of each glob use walks the file again. A link step
  that resolves the glob uses again on each such read does work that grows with the orders of the
  eight glob uses, and the case does not end. The calls of names that only a glob use of a crate can
  bring stay records.
