description: >-
  builder binds c to Client::new(), then binds c again to c.with_retry(), which returns a Client, and calls
  c.send(). branch binds c to a Client and again to a Client in a block. Each let of c holds a Client, so each
  call runs a method of Client. The call c.with_retry() sits in the value of the second let, where the first
  let still binds c. An index that counts a let before its statement ends, or that makes each call after a
  second let a record, gives the calls the low name edges of send, and std::fs::create_dir of Other::send reads
  found. The calls keep their targets, so std::fs::create_dir is not-found.
