source: safedep:hand
description: >-
  The file declares the alias Imp two times, as unix::Thing under cfg(unix) and as windows::Thing under
  cfg(windows). Only the open and the close of unix::Thing call the standard library. main calls Imp::open,
  and work calls close on a parameter of the type Imp. The index does not know which cfg the build sets, so
  the alias binds no type. Each call gets the record unknown-receiver and a name edge to the method of each
  type. So std::fs::remove_file and std::process::Command::new are found. An index that lets the last alias
  win gives only the methods of windows::Thing, and both targets read not-found.
