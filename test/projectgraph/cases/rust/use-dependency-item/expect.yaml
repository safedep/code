source: safedep:hand
description: >-
  main.rs binds items of the crate dep with use and calls each one by its bound name: a function (top), a renamed
  function (renamed as r), two names of one use list (other, Type), a function of a nested module (sub::nested), a
  function that lib.rs gives on with pub use (reexported), and a use in a function body (inner). The code of the
  crate is the unit cargo:dep@1.0.0. A use path names a module or an item, so the link step reads dep::top as the
  module of the origin, and the unit gives the function top itself. Before the link step linked an item that way,
  the external key had no package edge, and each target but run_sink was not-found. main does not call unused, so
  unused_sink stays not-found.
units:
  vendor/dep: cargo:dep@1.0.0
