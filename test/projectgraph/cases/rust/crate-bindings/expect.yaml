source: safedep:hand
description: >-
  The crate kit is the unit cargo:kit@1.0.0, and no unit gives the crate aes. src/secure/mod.rs binds kit with extern
  crate, so crate::secure::kit::flush() in src/secure/aes.rs calls kit//flush. src/main.rs binds kit as ffi with
  pub use, and its test module binds ffi again with use crate::ffi. So ffi::reset() after use super::ffi and
  crate::ffi::Store::open() in src/store.rs call kit//reset and kit//Store//open. src/defs.rs names kit::Store as the
  type alias Handle, so Handle::open() calls kit//Store//open, and the declared type Handle of h gives
  kit//Store//save. The alias binds the key kit//Store and makes no node of it, so no type target turns from
  no-such-target into not-found. src/secure/aes.rs binds aes with extern crate, and make imports self::aes::Cipher.
  The file has the name of the crate, and the crate still names no module of the project. No unit gives aes, so the
  use is a no-dependency-source record with the import prefix aes, and the extern crate has no record. A target of
  aes is uncertain, and kit//unused, which no code calls, stays not-found. Cipher::new() calls the external key
  aes//Cipher//new, as a call of aes::Cipher::new() does.
