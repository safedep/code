description: >-
  The file declares the struct T, and the type parameter T of Holder<T> and of impl<T: Save> Wrap<T> shadows
  it. So the field item: T of Holder and the result &T of Wrap::get hold the type that the caller gives: Disk
  in by_field and Cloud in by_result. Disk::save calls std::fs::remove_file and Cloud::save calls
  std::fs::create_dir. An index that keeps T as the type of the field and of the result makes the link step
  read the struct T, so both calls go to T::save with no record, and both targets read not-found. The index
  keeps no such type, so each call is a record. The record of h.item.save() gets the low name edges of save.
