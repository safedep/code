description: >-
  The file defines its own macro_rules! vec, whose rule binds the name that its call passes to a Cloud. go
  binds t to a Disk, calls vec!(t), and calls t.save(), which runs Cloud::save. Cloud::save calls
  std::fs::remove_dir_all. A macro of std binds no name of its caller, but this vec is no macro of std. An
  index that takes vec! for the macro of std keeps the call graph target Disk::save with no record, and
  std::fs::remove_dir_all reads not-found. The index makes the call a record with the reason
  unknown-receiver, so it gets the low name edges of save.
