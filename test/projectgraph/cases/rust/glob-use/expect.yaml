source: safedep:hand
description: >-
  The case of the vet reach corpus rust/glob-use. main brings in every item of the module dep::html with a glob use
  and calls render. The code of the crate dep is the unit cargo:dep@1.2.0, which gives render in that module, so the
  call gets the edge to dep//html//render and its package edge. A local closure or a parameter can also bind a
  single name, so the call keeps its record of the method render. Nothing calls escape, so escape is not-found.
units:
  vendor/dep: cargo:dep@1.2.0
roots:
  - key: src/main.rs
    kind: main
    rule: rust.main
  - key: src/main.rs//main
    kind: main
    rule: rust.main
exact_edges: true
edges:
  - from: src/main.rs//main
    to: dep//html//render
    kind: direct
    confidence: high
    site: src/main.rs:4
  - from: dep//html//render
    to: cargo:dep@1.2.0//src/html.rs//render
    kind: package
    confidence: high
    site: cargo:dep@1.2.0//src/html.rs:1
unresolved:
  - caller: src/main.rs//main
    site: src/main.rs:4
    reason: unknown-receiver
    method: render
results:
  - target: dep//html//render
    status: found
    path:
      - key: src/main.rs//main
      - key: dep//html//render
        site: src/main.rs:4
        kind: direct
        confidence: high
    call_sites:
      - caller: src/main.rs//main
        site: src/main.rs:4
        reached: true
  - target: dep//html//escape
    status: not-found
