source: safedep:hand
description: >-
  src/store.rs declares the structs Holder and Item at its top level, and the inline module cache declares its
  own Holder and Item. In cache, the field item of Holder, the result of make and the struct expression
  Holder { .. } name the types of cache. So h.item.save() and make().save() run cache::Item::save, which calls
  std::fs::create_dir. The save of the top level calls std::fs::write and nothing calls it. A link step that
  resolves these names at the root of the file sends both calls to the save of the top level, so
  std::fs::create_dir reads not-found and std::fs::write reads found.
