description: >-
  src/net.rs declares the module tls at its top level and the inline module client, which declares its own
  module tls. client has use self::tls::conn, so conn names client::tls::conn, and go calls conn::open, which
  calls std::fs::create_dir. The tls of the top level has its own conn::open, which calls std::fs::read and
  which nothing calls. A link step that reads self of the inline module as the module of the file gives the call
  the edge to the wrong open, so std::fs::create_dir reads not-found and std::fs::read reads found.
