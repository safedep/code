source: safedep:hand
description: >-
  main.rs has #[macro_use] extern crate dep, and dep exports the macro log with #[macro_export]. src/job.rs calls
  log!(), which runs that macro and so dep::sink. src/util.rs defines a function log and the struct Store a
  method log. A macro call reads macros only, so neither shadows the macro of dep. A link step that takes any
  definition of the name for a macro of the crate gives the call no edge, and dep//sink reads uncertain.
units:
  vendor/dep: cargo:dep@1.0.0
roots:
  - key: src/main.rs
    kind: main
    rule: rust.main
  - key: src/main.rs//main
    kind: main
    rule: rust.main
edges:
  - from: src/job.rs//go
    to: dep//log
    kind: direct
    confidence: high
    site: src/job.rs:2
unresolved:
  - caller: src/job.rs//go
    site: src/job.rs:2
    reason: unknown-receiver
    method: log
results:
  - target: dep//sink
    status: found
    path:
      - key: src/main.rs//main
      - key: src/job.rs//go
        site: src/main.rs:8
        kind: direct
        confidence: high
      - key: dep//log
        site: src/job.rs:2
        kind: direct
        confidence: high
      - key: cargo:dep@1.0.0//src/lib.rs//log
        site: cargo:dep@1.0.0//src/lib.rs:2
        kind: package
        confidence: high
      - key: cargo:dep@1.0.0//src/lib.rs//sink
        site: cargo:dep@1.0.0//src/lib.rs:4
        kind: direct
        confidence: high
    call_sites:
      - caller: cargo:dep@1.0.0//src/lib.rs//log
        site: cargo:dep@1.0.0//src/lib.rs:4
        reached: true
