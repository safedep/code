source: safedep:hand
description: >-
  handle calls run on a parameter of the type Core. Base is an abstract class that extends Core and
  overrides run with a call of child_process.execSync, and Impl extends Base. The declared type narrows
  the receiver to Core, so the call has a member edge to Core.run and a cha edge to Base.run, the override
  of the abstract class. The path to execSync goes through the cha edge.
