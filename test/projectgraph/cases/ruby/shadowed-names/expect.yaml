source: safedep:adversarial
description: Names that look alike call different methods. Report in module Billing is Billing::Report of another file, not the top-level Report. A::Foo and B::Foo both define run. Foo.run calls the class method self.run, not the run of an instance. valid? is not valid. A local variable upload shadows the method upload. A comment, a string and respond_to? call nothing, and private names danger without a call.
