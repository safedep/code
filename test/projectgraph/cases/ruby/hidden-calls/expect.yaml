source: safedep:adversarial
description: Ruby calls methods with no call of their name. An alias and alias_method call the old method by the new name. A mixin gives start_job to Runner. Interpolation calls to_s, and a + b calls +. method(:name) and &:name pass a method by a symbol. A bare name calls a top-level method of another file. Deep::Inner finds Helper in module Jobs. A block of Struct.new defines show on a class that the source does not name, so its target stays uncertain and does not look like not-found.
