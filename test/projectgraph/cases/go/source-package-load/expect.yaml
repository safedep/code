source: safedep:hand
test_paths: ["*_test.go"]
description: >-
  The module top level of main.go holds os.Exit in the slice hooks and os.Getwd in the field Hook of
  defaults. run calls hooks[0], and runHook calls the field Hook of its parameter. impl.go holds os.Remove in
  the map table, and T.Handle calls table["rm"]. lib.Serve calls Handle on a value of an interface, and lib
  does not import impl. extra.go holds os.Chdir, and Run calls steps[0]. The test file of extra holds
  os.RemoveAll. A call of a function value concerns no target, because the search reaches the code that
  holds the value. The program runs the module top level of each file of a package before any code of the
  package. So a search from a source enters the module top levels of each package that it enters, and each
  target is found from each source. idle calls nothing, and os.Exit is found from it too, because the
  program loads main.go before idle runs. A test file loads only with the code of a test, so os.RemoveAll
  is not found from Run, and is found from TestRun. The roots of kind main do not reach extra, so os.Chdir
  is found only with the tests, through the test root of extra.
roots:
  - key: extra/extra_test.go
    kind: test
    rule: test.files
  - key: extra/extra_test.go//TestRun
    kind: test
    rule: test.files
  - key: main.go
    kind: main
    rule: go.main
  - key: main.go//main
    kind: main
    rule: go.main
