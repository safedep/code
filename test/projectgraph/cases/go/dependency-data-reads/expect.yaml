source: safedep:hand
description: >-
  The unit markup has a struct Node with the field Data, a constant KindText, a variable ErrNoRows that
  errors.New gives, a variable Handler that holds a function literal, a variable Run that holds the function
  run, a struct Writer that embeds the struct Base, a struct Client that embeds the interface Conn, and in
  netctx the alias Context of context.Context of the standard library. A read of n.Data, KindText or ErrNoRows
  runs no code, so the walk into the unit gives no package edge and no record. The reference edges of main end
  at the external keys. A call of Run gets a package edge to run. A call of Handler keeps an unknown-receiver
  record, in main and in Render, because the index does not know the function that the variable holds.
  Writer.Flush is the promoted method Base.Flush. Client.Close is the method Close that the embedded interface
  Conn declares, and netctx.Context.Done is the method Done of the interface context.Context of the unit of
  the standard library. A call of such a method runs the code of the type that the interface value holds, so
  each keeps an interface-receiver record, and a target that only that code reaches is uncertain, not found.
