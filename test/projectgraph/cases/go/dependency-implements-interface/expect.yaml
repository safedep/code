source: safedep:hand
description: >-
  main holds a value of the project interface Runner and calls Run on it. The value comes from New of the
  dependency dep, whose type Impl implements Runner and calls exec.Command in Run. The interface is
  first-party, so Impl.Run of the unit is a cha candidate, and the site keeps its record. The cha edge goes to
  the external key of Impl.Run, so a target of that key finds the path, and a package edge joins the key to
  the definition. The record has
  the method Run, and Impl.Run reaches exec.Command, so the target is never not found.
