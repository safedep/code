source: safedep:hand
description: >-
  main calls the result of backoff.Linear, a function literal that calls os.Getenv. The index gives the
  calls of the literal to Linear, so the path to os.Getenv goes through Linear. main calls fns[0], which
  holds the method value h.Handle on a value of the interface handler, and more[0], which holds run from a
  channel. A call of a function value runs a function that some code uses as a value, so each such call is
  a function-value record that concerns no target. The send of run is a reference, so os.Getwd is found.
  The link step cannot name the method of h.Handle, so the reference is a record with the method name
  Handle. The record gets a name edge to local.Handle, so os/exec.LookPath is found. No code uses unused as
  a value, so os.Remove is not found.
