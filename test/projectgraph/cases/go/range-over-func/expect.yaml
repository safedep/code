    to: main.go//walk
    kind: reference
    confidence: low
    site: main.go:25
  - from: main.go//main
    to: main.go//tree//All
    kind: reference
    confidence: low
    site: main.go:28
no_edges:
  - from: main.go//main
    to: main.go//unused
  - from: main.go//main
    to: os//Remove
  - from: main.go//main
