source: safedep:hand
description: >-
  main ranges over the function walk and over the method value t.All, as Go 1.23 allows. The range
  calls the function, and the function calls the body of the loop through yield. So the range
  expression is a reference, as an argument is, and os.Remove and os/exec.LookPath are found through it. A
  range clause with no reference lost both. The range over a slice names no function. No code uses unused,
  so os.Getwd is not found.
