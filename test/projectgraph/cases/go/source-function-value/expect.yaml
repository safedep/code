source: safedep:hand
description: >-
  The init of plugins stores os.Remove in the map and in the slice of registry, and only main imports
  plugins. ByName calls handlers["rm"], and First calls list[0]. setup stores os.Chdir in fs[0], and main
  calls setup and then serve, which calls fs[0]. A search from the roots reaches each code that stores a
  function value, so os.Remove and os.Chdir are found through the references, and a call of a value
  concerns no target. No code uses os.Exit as a value, so os.Exit is not found. The program runs code
  before a source that a search from the source does not reach, as the init of plugins before ByName or
  setup before serve. So in a search with a source, each call of a value concerns every target. os.Remove is
  uncertain from ByName and from First, os.Chdir from serve, and os.Exit from serve also with the roots.
  serve finds os.Remove, because the program loads main.go, and with it plugins, before serve runs.
