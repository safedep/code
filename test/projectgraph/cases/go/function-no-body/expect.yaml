description: >-
  Three functions have no body. add of the project and Sum of the unit fast are stubs of assembly, and the
  assembly calls slow and fallback. now is a function that //go:linkname binds to runtime.nanotime. The
  code of each one is not Go source of the graph, so the index gives each stub a record with the reason
  no-dependency-source. The assembly of the project can call any function, so its record concerns every
  target, and os.Remove and os.Getwd are uncertain from viaAsm. The assembly of a unit calls the code of
  its package and of the runtime, so its record concerns what the code of the unit reaches.
  os/exec.LookPath is uncertain from viaUnit, and os.Getwd is not found from it. The code of the standard
  library calls back only a method of an exported name, so the record of now is a callback. os.Chdir,
  which closer.Close calls, is uncertain from viaLinkname, and os.Getwd is not found from it. With no
  record, each search ended at the stub, and each target read not-found. alias is bound by //go:linkname
  to aliased of its own package main. The path main has no dot, as a path of the standard library, but a
  package of the graph gives it. So the link step joins alias to aliased with an edge, and os.Mkdir is
  found from viaAlias. A callback there read not-found.
