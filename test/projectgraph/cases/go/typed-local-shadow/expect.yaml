source: safedep:hand
description: >-
  main declares x as a local, and an inner block declares x again as a remote. The call x.run() in the
  block runs remote.run, which calls os/exec.LookPath. The index records the typed locals of a function
  with no extent, and the link step reads the type of the first one. So the index checks that the binding
  of x in scope at the call is the binding whose type the link step reads. Here it is not, so the call is
  an unknown-receiver record with the method name run, which gets a name edge to remote.run. The method
  value x.stop is a record of the same kind, with the name stop. A type of the first x gave not-found for
  os/exec.LookPath. The call x.run() before the block keeps its member edge to local.run.
