source: safedep:hand
description: >-
  No unit gives the standard library. handler.ServeHTTP calls os.Remove, and each via function calls
  ListenAndServe of an http.Server, or of http, on a value whose type the link step does not know: a
  package-level variable, an element of a slice, a range variable, a parameter of a first-party interface, a
  method value, and a dot import. viaField calls a function value that a field holds. Each call is a record
  with a method name, and such a call can run a method of the standard library, which calls back ServeHTTP.
  So the caller of each record also has a callback record, and os.Remove is uncertain from each via
  function. A call of a function value, as the field of viaField or a name that no definition of the file
  binds, as ListenAndServe after the dot import, also concerns every target from a source. quiet.Idle calls nothing, and its package holds no load code, so os.Remove is not found from it.
  A source in package main would enter the module top level of main.go, which holds http.ListenAndServe as a
  value.
roots:
  - key: dot.go
    kind: main
    rule: go.main
  - key: main.go
    kind: main
    rule: go.main
  - key: main.go//main
    kind: main
    rule: go.main
