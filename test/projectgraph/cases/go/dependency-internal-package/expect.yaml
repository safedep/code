description: >-
  main calls Serve of the unit github.com/acme/kit. Serve calls Encode and the method Flush of Buffer of the
  internal package github.com/acme/kit/internal/wire, and Encode calls the unexported frame. Only the module can
  import an internal package, so the project names no key of it, and the summary has no symbol of it. An advisory
  names a symbol of an internal package by its import path, as
  google.golang.org/grpc/internal/transport.NewServerTransport. So a definition of an internal package carries its
  external key, and each target finds its path. Before, the definitions had no external key, and each target was
  no-such-target. Unused is called by nothing, so it is not-found.
