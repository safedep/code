source: safedep:hand
description: >-
  main gives code of the project to the unit srv in four ways. Run calls the named function named, which
  main passes as a value. Each calls a function literal that main passes in a slice. Serve calls Handle on
  a value of the interface Handler, and Bind calls the method value c.Close on a value of the interface
  Closer. A function that main passes is a reference of main, and the calls of a literal belong to main, so
  os.Getwd and os.Getenv are found. The call fs[0]() in Each is a function-value record that concerns no
  target. The call h.Handle() in Serve has no implementation in the graph, so it is an interface-receiver
  record with the method Handle, and os/exec.LookPath, which mine.Handle calls, is uncertain. The link step
  cannot name the method of c.Close, so the reference is a record with the method Close, which gets a name
  edge to conn.Close. So os.Chdir is found. No target that a callback reaches is not found. No unit gives
  the standard library, and a call of a method on a value of an unknown type can run a method of it, so the
  caller of each method record also has a callback record. conn.Close, a candidate of c.Close, calls
  os.Chdir, whose callback reaches mine.Handle. So the record c.Close also concerns os/exec.LookPath.
