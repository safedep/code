description: >-
  tokens holds z := markup.NewTokenizer(nil) and calls z.Next, and calls Close on the result of Raw on the result
  of NewTokenizer. tree calls Render on the first result of Parse, and send calls Write on the first result of
  http.NewRequest. The unit of markup gives the result type of each function and method, and the unit of the
  standard library, as GOROOT/src gives it, gives the type of NewRequest. So each call gets the external key of
  the method of the type, as example.com//markup//Tokenizer//Next, and a package edge joins the key to the
  definition of the unit.
