source: safedep:hand
description: >-
  main passes remove to run, lookup to each in a slice, getwd to fire in the field fn of a hook, and
  getenv to call, which stores it in the typed local g, and chdir to pick in a map. run calls its
  parameter f, each its range variable g, fire the field fn of its range variable h, call its local g, and
  pick the element of its parameter m at a variable key. A search from the roots reaches main, which holds
  each function as a value, so os.Remove is found through the reference. A search from run, each, fire,
  call or pick alone does not reach main. Each call there runs a function value that the search does not
  reach, so the call is a function-value record, which concerns every target in a search with a source.
  Each target is then uncertain. A record with the name alone, as f or fn, gave not-found there.
roots:
  - key: main.go
    kind: main
    rule: go.main
  - key: main.go//main
    kind: main
    rule: go.main
no_edges:
  - from: main.go//run
    to: main.go//remove
  - from: main.go//run
    to: os//Remove
unresolved:
