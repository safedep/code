source: safedep:hand
description: >-
  main calls Run of the unit github.com/acme/kit. No Go build reads two files of the unit, so the index step
  leaves them out. gen.go has //go:build ignore and package main, and kit_test.go is a test file. So the link
  step records no truncation for a second package clause, and their calls reach no graph. kit_windows.go has
  //go:build windows and stays, because a reach answer must hold for every platform: its call of
  syscall.CloseHandle is in the graph, and no root reaches it. tables.go is a generated file whose var holds a
  string of 60 parts, past the depth limit of the index. Its index blanks the data value and keeps the body of
  lookup, so the file is complete, gives no budget and keeps its calls.
units:
  gomod/github.com/acme/kit@v1.0.0: go:github.com/acme/kit@v1.0.0
