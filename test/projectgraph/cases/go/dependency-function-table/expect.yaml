source: safedep:hand
description: >-
  main calls a.F of the unit a, and F calls the function value that b.Get of the unit b returns. Get reads
  it from the package-level map table, which holds doA. The program loads b, because a imports it, so it
  runs the module top level of b.go, with the init of b and the reference to doA. The import of b makes a.go
  run code at load, so main.go reaches a.go and b.go through import edges. So the search finds os.Remove
  through the reference to doA, and os/exec.Command through init. The call of the value concerns no
  target, and no code uses doB as a value, so os.Getwd is not found.
