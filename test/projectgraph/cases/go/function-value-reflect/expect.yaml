    status: uncertain
    call_sites:
      - caller: main.go//T//Hidden
        site: main.go:12
        reached: false
    uncertainties:
      - kind: unresolved-call
        site: main.go:25
      - kind: unresolved-call
        site: main.go:25
  - target: os//exec//Command
    status: uncertain
    call_sites:
