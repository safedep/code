description: >-
  main calls os.Getenv, whose code no unit gives, and Run of the unit github.com/acme/kit. The callback record
  of os//Getenv concerns only the targets that a method of an exported name reaches, because the standard
  library imports no package outside it and reflection gives no method of an unexported name. closeConn is
  uncertain, because the method Close of the unexported type client calls it. handshake is not-found, because
  only the function Dial calls it, and the standard library calls a function of another module only through
  a function value, which a reference edge joins. resetConn and the method reset are not-found, because no
  method of an exported name reaches them.
