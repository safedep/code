source: safedep:hand
description: >-
  main panics with the error that Fail of the unit github.com/acme/kit gives. No recover stops the panic, so
  the runtime prints the value with its method Error, and Error calls report. The builtin panic has a record
  for the methods Error and String, so report is uncertain, not not-found. The runtime does not call Unwrap,
  so unwrap is not-found. No code of the standard library runs here, so no callback record makes it
  uncertain.
units:
  gomod/github.com/acme/kit@v1.0.0: go:github.com/acme/kit@v1.0.0
roots:
  - key: main.go
    kind: main
    rule: go.main
  - key: main.go//main
    kind: main
    rule: go.main
unresolved:
  - caller: panic
    reason: no-dependency-source
    method: Error
  - caller: panic
    reason: no-dependency-source
    method: String
results:
  - target: github.com//acme//kit//report
    status: uncertain
    call_sites:
      - caller: go:github.com/acme/kit@v1.0.0//kit.go//failure//Error
        site: go:github.com/acme/kit@v1.0.0//kit.go:7
        reached: false
    uncertainties:
      - kind: unresolved-call
  - target: github.com//acme//kit//unwrap
    status: not-found
    call_sites:
      - caller: go:github.com/acme/kit@v1.0.0//kit.go//failure//Unwrap
        site: go:github.com/acme/kit@v1.0.0//kit.go:11
        reached: false
