source: safedep:hand
description: >-
  Handler defines no handle, and its __getattr__ gives cleanup for any name. dispatch calls handle on its
  parameter, so the receiver is unknown and the site is a record with the method name handle. No definition
  of the name handle exists, and the call runs cleanup, which calls os.remove. main makes a Handler, and a
  read of an attribute of a Handler can run Handler.__getattr__, so a reference edge joins Handler to
  Handler.__getattr__. The function that __getattr__ returns is a reference of it.
