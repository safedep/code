  The Lib directory of CPython is the unit python:std@3.12.3. Worker extends threading.Thread, and the
  main guard calls start, which the unit gives. start runs _bootstrap, _bootstrap calls self.run, and the
  class hierarchy analysis adds the override Worker.run of the project, through the external key of
  Thread that Worker names as its base. The override rule keeps its reference edge from Worker to run, and
  the search reports that shorter path. subprocess.run resolves into the unit, and its path goes on to
  os.execvp, a module that the unit does not hold. The test suite of the unit is left out.
