source: safedep:hand
description: >-
  google-auth and google-cloud-storage share the namespace package google in one site-packages
  directory. Each unit is the package directory that its RECORD gives under the namespace. An import of
  google.auth.crypt resolves into google-auth alone, and one of google.cloud.storage into
  google-cloud-storage alone, so neither unit misses a module of the other, and no record names a unit
  that no import loads.
units:
  venv/site-packages/google/auth: pypi:google-auth@2.0.0
  venv/site-packages/google/cloud/storage: pypi:google-cloud-storage@2.1.0
import_dirs:
  - venv/site-packages
