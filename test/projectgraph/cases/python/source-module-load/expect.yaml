source: safedep:hand
description: >-
  The module top level of handlers.py holds os.system in the list HOOKS, and os.getcwd in the attribute hook
  of DEFAULTS. run calls HOOKS[0], and run_hook calls the attribute hook of its parameter. The program runs
  the module top level of handlers.py before run or run_hook can run. So a search from run or run_hook
  alone enters it, and each target is found through the reference there. Without that step, the call of
  o.hook concerns only the targets of the method name hook, and os.getcwd reads as not-found.
