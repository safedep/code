description: >-
  main.py calls requests.get. requests and urllib3 are two units in one site-packages directory, and six.py
  there has no unit, so the index step skips it. The __init__.py of requests gives get from requests/api.py,
  get calls urllib3.request, and the __init__.py of urllib3 gives request from poolmanager.py, which calls
  socket.create_connection. The path goes through the package tree of both packages. The import of requests
  runs its __init__.py. post is not called.
