    to: pypi:badpkg@1.0.0//badpkg/__init__.py//load
    kind: package
    confidence: high
    site: pypi:badpkg@1.0.0//badpkg/__init__.py:1
  - from: pypi:badpkg@1.0.0//badpkg/__init__.py//load
    to: pypi:badpkg@1.0.0//badpkg/big.py
    kind: export
    confidence: high
    site: pypi:badpkg@1.0.0//badpkg/__init__.py:1
unresolved: []
results:
