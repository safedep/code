        site: main.py:4
        kind: direct
        confidence: high
      - key: pypi:okpkg@1.0.0//okpkg/__init__.py//run
        site: pypi:okpkg@1.0.0//okpkg/__init__.py:4
        kind: package
        confidence: high
      - key: subprocess//run
        site: pypi:okpkg@1.0.0//okpkg/__init__.py:5
        kind: direct
        confidence: high
    call_sites:
      - caller: pypi:okpkg@1.0.0//okpkg/__init__.py//run
        site: pypi:okpkg@1.0.0//okpkg/__init__.py:5
        reached: true
  - target: os//system
    status: uncertain
    uncertainties:
      - kind: budget
        site: pypi:badpkg@1.0.0//badpkg/big.py
