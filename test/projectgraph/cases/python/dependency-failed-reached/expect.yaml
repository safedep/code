source: safedep:hand
description: >-
  badpkg/big.py of the dependency badpkg is over the size limit, so its index fails. main.py calls
  badpkg.load, and the __init__.py of badpkg gives load from big.py. The search goes into badpkg and
  reaches the module node of big.py, which has no index. So a target that the search does not find is
  uncertain with the cause budget, as os.system, which big.py calls.
units:
  deps/okpkg: pypi:okpkg@1.0.0
  deps/badpkg: pypi:badpkg@1.0.0
max_file_bytes: 300
failed:
  - pypi:badpkg@1.0.0//badpkg/big.py
roots:
