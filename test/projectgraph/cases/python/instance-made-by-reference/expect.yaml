  calls the class of the method. functools.partial and field(default_factory=...) get the class as a
  value and call it. So each of these sites links the __call__ or __getattr__ of the class, and os.remove,
  shutil.rmtree and subprocess.run are found. check names Meta only in isinstance, which makes no
  instance, and no class names Meta as its metaclass, so tempfile.mkdtemp in Meta.__call__ is not-found.
