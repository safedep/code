source: safedep:hand
description: >-
  Each class makes an instance in a way other than a call of its name. cls() in the classmethod create
  calls the class of the method. functools.partial and field(default_factory=...) get the class as a
  value and call it. klass() in a function that the classmethod build defines calls its first parameter.
  self.__class__() in clone and type(self)() in dup call the class of the instance, and copies calls
  clone and dup on a parameter, and raise Raised makes an instance of
  Raised. So each of these sites links the __call__ or __getattr__ of the class, and the os targets of
  those classes are found. check names Meta only in isinstance, and check_more names Checked only in
  typing.cast, hasattr and a conditional in isinstance, which make no instance. So tempfile.mkdtemp and
  os.mkdir are not-found. Shadowed.build defines inner,
  whose parameter klass hides the class, and local, which assigns klass. Neither call of klass makes a
  Shadowed, so os.kill is not-found.
