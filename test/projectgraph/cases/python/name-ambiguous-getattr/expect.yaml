source: safedep:hand
description: >-
  dispatch calls handle on the parameter handler. 24 classes define a method handle, so the site is over
  the cap of 20 and is ambiguous. main passes an H0, which defines no handle. Its __getattr__ gives cleanup,
  which calls os.remove. That code is no definition of the name handle. So the site keeps no method name
  and concerns every target, and os.remove is uncertain and not not-found.
roots:
  - key: main.py
    kind: manifest
    rule: procfile
unresolved:
  - caller: main.py//dispatch
    site: main.py:4
    reason: ambiguous
results:
  - target: os//remove
    status: uncertain
    call_sites:
      - caller: handlers.py//cleanup
        site: handlers.py:4
        reached: false
    uncertainties:
      - kind: unresolved-call
        site: main.py:4
