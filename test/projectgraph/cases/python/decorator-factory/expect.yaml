source: safedep:hand
description: >-
  run has three decorators: a call of click.command, the first-party verbose_option, and a call of
  click.option. verbose_option returns the value of click.option(...) applied to f. Each decorator names its
  code, so none is a dynamic feature, and the call of the value of click.option(...) is no record of its own,
  because the graph reaches the code of click through the call of click.option. The module top level runs
  each decorator when it defines run. os.system is no such target, which only holds with no record and no
  flag that concerns every target.
