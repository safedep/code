source: safedep:hand
description: >-
  dispatch calls handle on the parameter handler. 25 classes define handle, so the site is ambiguous and gets
  no name edge. H0.handle calls load on its field codec, whose value the index does not know, so that site is
  a record with the method load. main passes the module yaml as the codec, so the program runs yaml.load. No
  edge leads from a candidate of handle to yaml.load. A Python call of a name can run code that no definition
  of the name holds, so the ambiguous site keeps no method name and concerns every target. yaml.load is
  uncertain and not no-such-target, and so is os.remove, which only the uncalled cleanup calls.
roots:
  - key: main.py
    kind: manifest
    rule: procfile
no_edges:
  - from: main.py//dispatch
    to: handlers.py//H0//handle
unresolved:
  - caller: handlers.py//H0//handle
    site: handlers.py:9
    reason: no-definition
    method: load
  - caller: main.py//dispatch
    site: main.py:6
    reason: ambiguous
results:
  - target: yaml//load
    status: uncertain
    uncertainties:
      - kind: unresolved-call
        site: main.py:6
  - target: os//remove
    status: uncertain
    call_sites:
      - caller: handlers.py//cleanup
        site: handlers.py:133
        reached: false
    uncertainties:
      - kind: unresolved-call
        site: main.py:6
