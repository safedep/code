source: safedep:hand
description: >-
  The unit of outer is its package directory, so its files are __init__.py and impl.py at the root of
  the unit. The root of such a unit is the package, with the name of the unit. So import outer links the
  module top level of the package, and outer.run links run, which __init__.py gives on from impl.py.
units:
  venv/site-packages/outer: pypi:outer@1.0.0
