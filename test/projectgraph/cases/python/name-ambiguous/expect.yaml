source: safedep:hand
description: >-
  dispatch calls handle on the parameter handler, whose value the index does not know. 25 classes define
  handle. That is over the cap of 20, so the site gets no name edge and is ambiguous. A Python call of a
  name can run code that no definition of the name holds, as a class attribute that holds an object with
  __call__. So the site keeps no method name and concerns every target. yaml.load, which H0.handle calls,
  and os.remove, which only the uncalled cleanup calls, are uncertain.
roots:
  - key: main.py
    kind: manifest
    rule: procfile
edges:
  - from: main.py
    to: main.py//dispatch
    kind: direct
    confidence: high
    site: main.py:8
no_edges:
  - from: main.py//dispatch
    to: handlers.py//H0//handle
unresolved:
  - caller: main.py//dispatch
    site: main.py:5
    reason: ambiguous
results:
  - target: yaml//load
    status: uncertain
    call_sites:
      - caller: handlers.py//H0//handle
        site: handlers.py:8
        reached: false
    uncertainties:
      - kind: unresolved-call
        site: main.py:5
  - target: os//remove
    status: uncertain
    call_sites:
      - caller: handlers.py//cleanup
        site: handlers.py:132
        reached: false
    uncertainties:
      - kind: unresolved-call
        site: main.py:5
